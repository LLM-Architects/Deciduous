[project]
name = "deciduous"
version = "0.2.0"
description = "One-pass decisions with full-weight supervised training"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "transformers==5.17.0",
  "accelerate==1.15.0",
  "pillow==12.3.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "datasets==5.0.1",
  "matplotlib==3.11.2",
  "kernels==0.16.1",
  "flash-linear-attention==0.5.2",
  "safetensors==0.8.0",
  "numpy==2.5.3",
  "huggingface-hub==1.31.0",
  "imageio-ffmpeg>=0.6",
]

[project.scripts]
deciduous-data = "deciduous.data:main"
deciduous-train = "deciduous.train:main"
deciduous-evaluate = "deciduous.evaluate:main"
deciduous-serve = "deciduous.server:main"
deciduous-report = "deciduous.report:main"

[project.optional-dependencies]
mlx = [
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.6.3",
    "tokenizers>=0.21",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest",
]

[tool.mypy]
files = ["src/deciduous"]
python_version = "3.12"
strict = true
cache_dir = ".cache/mypy"
untyped_calls_exclude = ["transformers", "datasets", "torch._tensor.Tensor.backward"]

[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "mlx_vlm.*", "tokenizers.*", "jinja2.*", "artifact", "vision_artifact"]
ignore_missing_imports = true
